min_version = "2026.9.16"

[tools]
chezmoi = "2.73.0"

[tasks.init]
description = "Select this machine's configuration modules"
raw = true
run = 'chezmoi --source "{{ config_root }}" init'

[tasks.plan]
description = "Preview dotfiles without changing the home directory"
run = 'chezmoi --source "{{ config_root }}" apply --dry-run --verbose'

[tasks.diff]
description = "Compare managed files with this checkout"
run = 'chezmoi --source "{{ config_root }}" --no-pager diff'

[tasks.status]
description = "Show pending dotfile changes"
run = 'chezmoi --source "{{ config_root }}" status'

[tasks.apply]
description = "Review differences and interactively apply dotfiles"
depends = ["diff"]
raw = true
run = 'chezmoi --source "{{ config_root }}" apply --interactive'

[tasks."pi:deps"]
description = "Install dependencies in the existing local Pi extensions checkout"
dir = "{{ env.HOME }}/Workspaces/pi-extensions"
tools.bun = "1.4.2"
run = "bun install --frozen-lockfile"

[tasks."brew:check"]
description = "Check the recorded Homebrew packages without installing"
run = 'sh "{{ config_root }}/scripts/brew.sh" check'

[tasks."brew:install"]
description = "Install recorded packages without upgrading existing packages"
run = 'sh "{{ config_root }}/scripts/brew.sh" install'

[tasks."brew:dump"]
description = "Refresh the Homebrew snapshot from this Mac"
run = 'sh "{{ config_root }}/scripts/brew.sh" dump'

[tasks."brew:apps:check"]
description = "Check apps originally installed outside Homebrew"
run = 'sh "{{ config_root }}/scripts/brew.sh" apps-check'

[tasks."brew:apps:install"]
description = "Install the additional apps through Homebrew"
run = 'sh "{{ config_root }}/scripts/brew.sh" apps-install'

[tasks."macos:plan"]
description = "Preview the recorded macOS preferences without writing"
tools.python = "3.14.0"
run = 'python3 "{{ config_root }}/scripts/macos.py" plan'

[tasks."macos:apply"]
description = "Confirm and apply the recorded macOS preferences"
raw = true
tools.python = "3.14.0"
run = 'python3 "{{ config_root }}/scripts/macos.py" apply'

[tasks.test]
description = "Test deployment in isolated temporary home directories"
tools.python = "3.14.0"
run = "python3 -m unittest discover -s tests -v"
